<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>

  <text x="48" y="56" font-size="27" font-weight="700" fill="#0f172a">deadman — where the model is allowed to think</text>
  <text x="48" y="84" font-size="15" fill="#475569">Detection and execution are deterministic. Inference is fenced into one band, and everything it produces is re-checked by code.</text>

  <!-- DETERMINISTIC BAND: detection -->
  <rect x="48" y="120" width="352" height="440" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="72" y="150" font-size="13" font-weight="700" fill="#334155" letter-spacing="1.4">DETERMINISTIC · DETECT</text>

  <rect x="72" y="170" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="88" y="196" font-size="15" font-weight="600" fill="#0f172a">Probes</text>
  <text x="88" y="217" font-size="12.5" fill="#475569">disk · morning brief · Metricool · SMS relay</text>
  <text x="88" y="233" font-size="12.5" fill="#475569">one question, one surface, never raises</text>

  <rect x="72" y="262" width="304" height="94" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="88" y="288" font-size="15" font-weight="600" fill="#0f172a">Evidence</text>
  <text x="88" y="309" font-size="12.5" fill="#475569">observation: healthy / fault / UNOBSERVABLE</text>
  <text x="88" y="327" font-size="12.5" fill="#475569">method: api &gt; public &gt; artifact &gt; canary &gt; reported</text>
  <text x="88" y="345" font-size="12.5" fill="#475569">absence is a state, not a null</text>

  <rect x="72" y="376" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="88" y="402" font-size="15" font-weight="600" fill="#0f172a">Trust ceiling</text>
  <text x="88" y="423" font-size="12.5" fill="#475569">weakest cited method caps confidence,</text>
  <text x="88" y="439" font-size="12.5" fill="#475569">computed before the model is asked</text>

  <rect x="72" y="468" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="88" y="494" font-size="15" font-weight="600" fill="#0f172a">Self-liveness</text>
  <text x="88" y="515" font-size="12.5" fill="#475569">proved from a row written after a sweep,</text>
  <text x="88" y="531" font-size="12.5" fill="#475569">never a heartbeat</text>

  <!-- INFERENTIAL BAND -->
  <rect x="440" y="120" width="352" height="440" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="464" y="150" font-size="13" font-weight="700" fill="#92400e" letter-spacing="1.4">INFERENTIAL · GEMINI 3.5 FLASH via ADK</text>

  <rect x="464" y="170" width="304" height="112" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="480" y="196" font-size="15" font-weight="600" fill="#0f172a">Diagnose</text>
  <text x="480" y="217" font-size="12.5" fill="#475569">reads heterogeneous, unstructured detail</text>
  <text x="480" y="235" font-size="12.5" fill="#475569">that shares no schema across surfaces</text>
  <text x="480" y="253" font-size="12.5" fill="#475569">emits hypothesis + confidence + citations</text>
  <text x="480" y="271" font-size="12.5" fill="#475569">must quote evidence it was given</text>

  <rect x="464" y="302" width="304" height="112" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="480" y="328" font-size="15" font-weight="600" fill="#0f172a">Correlate</text>
  <text x="480" y="349" font-size="12.5" fill="#475569">no lineage graph exists between a disk,</text>
  <text x="480" y="367" font-size="12.5" fill="#475569">a phone relay and a scheduler</text>
  <text x="480" y="385" font-size="12.5" fill="#475569">so a shared cause is inferred from</text>
  <text x="480" y="403" font-size="12.5" fill="#475569">co-occurrence, never traversed</text>

  <rect x="464" y="434" width="304" height="106" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="480" y="460" font-size="14" font-weight="700" fill="#92400e">What the model may never do</text>
  <text x="480" y="481" font-size="12.5" fill="#7c2d12">assert a fact absent from the evidence</text>
  <text x="480" y="499" font-size="12.5" fill="#7c2d12">choose an action · execute anything</text>
  <text x="480" y="517" font-size="12.5" fill="#7c2d12">raise its own confidence ceiling</text>
  <text x="480" y="535" font-size="12.5" fill="#7c2d12">declare a fix successful</text>

  <!-- DETERMINISTIC BAND: act -->
  <rect x="832" y="120" width="400" height="440" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="856" y="150" font-size="13" font-weight="700" fill="#334155" letter-spacing="1.4">DETERMINISTIC · ACT &amp; VERIFY</text>

  <rect x="856" y="170" width="352" height="94" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="872" y="196" font-size="15" font-weight="600" fill="#0f172a">Select</text>
  <text x="872" y="217" font-size="12.5" fill="#475569">keyed on the diagnosed cause, not the fault</text>
  <text x="872" y="235" font-size="12.5" fill="#475569">expired credential must not re-queue;</text>
  <text x="872" y="253" font-size="12.5" fill="#475569">transient 5xx must. Below floor → escalate</text>

  <rect x="856" y="284" width="352" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="872" y="310" font-size="15" font-weight="600" fill="#0f172a">Execute</text>
  <text x="872" y="331" font-size="12.5" fill="#475569">hand-written code only. No action body is</text>
  <text x="872" y="347" font-size="12.5" fill="#475569">ever generated at runtime</text>

  <rect x="856" y="376" width="352" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="872" y="402" font-size="15" font-weight="600" fill="#0f172a">Verify</text>
  <text x="872" y="423" font-size="12.5" fill="#475569">re-runs the originating probe</text>
  <text x="872" y="441" font-size="12.5" fill="#475569">success = a fresh HEALTHY observation,</text>
  <text x="872" y="459" font-size="12.5" fill="#475569">never the executor's return value</text>

  <rect x="856" y="486" width="352" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="872" y="510" font-size="15" font-weight="600" fill="#0f172a">Alert, out of band</text>
  <text x="872" y="530" font-size="12.5" fill="#475569">refuses at startup to sit on a watched rail</text>

  <!-- flow arrows -->
  <line x1="400" y1="300" x2="456" y2="300" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="404" y="290" font-size="11.5" fill="#92400e">evidence</text>

  <line x1="792" y1="300" x2="848" y2="300" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="792" y="290" font-size="11.5" fill="#92400e">diagnosis</text>

  <path d="M 1032 560 L 1032 596 L 224 596 L 224 564" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="448" y="583" width="440" height="24" fill="#ffffff"/>
  <text x="468" y="600" font-size="12.5" fill="#475569">re-observe: the loop closes on evidence, not on a report of success</text>

  <!-- footer claim -->
  <rect x="48" y="632" width="1184" height="86" rx="10" fill="#0f172a"/>
  <text x="72" y="664" font-size="14.5" font-weight="700" fill="#f8fafc">The model earns its place on one job: reading messy, schema-less failure detail across systems that share nothing.</text>
  <text x="72" y="688" font-size="13.5" fill="#cbd5e1">Everything it says is checked by code before anything happens, and everything it causes is proved by re-observation afterwards.</text>
  <text x="72" y="708" font-size="13.5" fill="#cbd5e1">A monitor that trusts its own model is a heartbeat with extra steps.</text>
</svg>
