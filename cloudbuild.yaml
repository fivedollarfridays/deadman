# Builds and deploys deadman without a local Docker daemon: `docker build`
# and `docker push` below run on Cloud Build's own workers, not this
# machine's. Submit with:
#   gcloud builds submit --config cloudbuild.yaml .
#
# The image reference is spelled out in each step rather than assembled into
# a single _IMAGE substitution. Cloud Build expands substitutions in step
# args and in `images:`, but NOT inside another substitution's default value,
# so a default of `gcr.io/${PROJECT_ID}/deadman:latest` reaches the builder
# as that literal string and fails to parse as an image name.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/deadman:$_TAG', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/deadman:$_TAG']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --image=gcr.io/$PROJECT_ID/deadman:$_TAG
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet

images:
  - 'gcr.io/$PROJECT_ID/deadman:$_TAG'

# Every key here is referenced by a step above. Cloud Build rejects the whole
# config for a substitution that is declared and never used.
substitutions:
  _SERVICE: deadman
  _REGION: us-central1
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
