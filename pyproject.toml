[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman"
version = "0.1.0"
description = "Silent-failure detection and remediation agent for heterogeneous infrastructure"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
# The self-check is meant to be run by a scheduler, and a scheduler reads
# nothing but the exit status. Giving it a real console entry point is what
# makes "exits non-zero" a property of a command rather than of a function.
deadman-self-check = "deadman.self_check:main"
# Same reasoning for the collector: it is meant to be run by launchd
# (infra/launchd/com.deadman.collector.plist), not typed by hand, so it
# needs a real command a plist's ProgramArguments can name.
deadman-collector = "deadman.collector.run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.6,<1",
]
# Deliberately NOT part of `dev`. The diagnosis tests replay recordings from
# tests/recorded/, so the suite must be able to run — and does run in CI —
# with no model SDK present at all. Installing this is what a live smoke test
# or a deploy does, never what a test run does.
gemini = [
    "google-adk>=1.0",
]
# Also deliberately NOT part of `dev`, for the same reason. The store's
# contract suite runs the Firestore backend's mapping logic against an
# in-process double (tests/firestore_double.py), so installing the real SDK
# would buy the suite nothing and would quietly weaken
# tests/test_store_seam.py, whose whole job is to prove the package imports
# with no cloud SDK present. This is what a deploy installs, never a test run.
firestore = [
    "google-cloud-firestore>=2.16,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "allow_network: permit real sockets for this test (hermetic suite escape hatch)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# bpsai-pair generates and regenerates scripts/cc_hook.py, so it is vendor
# code whose style we do not own. Formatting it once already cost a real arch
# violation: expanding its return lists pushed build() from under the 50-line
# cap to 80, failing `arch check --strict` on a change that touched no deadman
# source. Excluded from the formatter only — `ruff check` still lints it.
exclude = ["scripts/cc_hook.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
